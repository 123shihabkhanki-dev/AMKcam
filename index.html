<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula Drive - Unlimited Storage Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .hide { display: none !important; }
        .drop-zone--over { border-color: #3b82f6; background-color: #eff6ff; }
        .file-card:hover .action-overlay { opacity: 1; }
        /* Custom Loading Bar */
        #upload-progress { transition: width 0.3s ease; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <div id="auth-screen" class="fixed inset-0 z-[100] bg-slate-900 flex items-center justify-center hide">
        <div class="bg-white p-10 rounded-2xl shadow-2xl w-full max-w-md mx-4">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-blue-600 rounded-2xl rotate-12 flex items-center justify-center mx-auto mb-4 shadow-lg">
                    <i class="fa-solid fa-cloud text-white text-4xl -rotate-12"></i>
                </div>
                <h2 class="text-3xl font-bold text-slate-800">Nebula Drive</h2>
                <p class="text-slate-400 mt-2">Login: admin@nebula.com / admin123</p>
            </div>
            <form id="login-form" class="space-y-4">
                <input type="email" id="login-email" required placeholder="Email Address" class="w-full px-5 py-4 border-2 border-slate-100 rounded-xl focus:border-blue-500 outline-none transition">
                <input type="password" id="login-pass" required placeholder="Password" class="w-full px-5 py-4 border-2 border-slate-100 rounded-xl focus:border-blue-500 outline-none transition">
                <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-blue-700 shadow-lg shadow-blue-200 transition active:scale-95">Enter Drive</button>
            </form>
        </div>
    </div>

    <div id="app-screen" class="flex-1 flex flex-col hide">
        
        <header class="bg-white border-b px-8 py-4 flex justify-between items-center sticky top-0 z-50">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-cloud-bolt text-blue-600 text-3xl"></i>
                <h1 class="text-2xl font-black text-slate-800 tracking-tight">NEBULA</h1>
            </div>
            
            <div class="flex items-center gap-6">
                <div class="hidden md:flex flex-col text-right">
                    <span class="text-xs font-bold text-slate-400 uppercase">System Status</span>
                    <span class="text-sm font-bold text-green-500">Unlimited Storage Active</span>
                </div>
                <button onclick="toggleSettings()" class="w-12 h-12 rounded-xl border-2 border-slate-50 hover:bg-slate-50 transition text-slate-400"><i class="fa-solid fa-shield-halved"></i></button>
                <button onclick="logout()" class="text-sm font-black text-slate-400 hover:text-red-500 transition">LOGOUT</button>
            </div>
        </header>

        <div class="flex flex-1 overflow-hidden">
            <main id="drop-zone" class="flex-1 overflow-y-auto p-8 transition-all relative">
                
                <div id="upload-status-box" class="mb-8 bg-white border-2 border-blue-100 p-6 rounded-3xl shadow-sm hide">
                    <div class="flex justify-between items-center mb-2">
                        <span id="upload-name" class="font-bold text-slate-700">File Name...</span>
                        <span id="upload-percent" class="text-blue-600 font-bold">0%</span>
                    </div>
                    <div class="w-full bg-slate-100 h-3 rounded-full overflow-hidden">
                        <div id="upload-progress" class="bg-blue-600 h-full w-0"></div>
                    </div>
                </div>

                <div class="flex justify-between items-end mb-10">
                    <div>
                        <h2 class="text-4xl font-black text-slate-800">My Files</h2>
                        <p class="text-slate-400 font-medium">Manage your personal database</p>
                    </div>
                    <div class="bg-slate-100 px-6 py-3 rounded-2xl font-bold text-slate-500 italic">
                        No Storage Limit Enabled
                    </div>
                </div>

                <div id="file-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-6 gap-6">
                    </div>

                <div id="empty-hint" class="flex flex-col items-center justify-center py-32 border-4 border-dashed border-slate-100 rounded-3xl hide">
                    <i class="fa-solid fa-cloud-arrow-up text-6xl text-slate-200 mb-4"></i>
                    <p class="text-slate-400 font-bold">Drag and Drop files here to upload without limits</p>
                </div>
            </main>
        </div>
    </div>

    <div id="fab" class="fixed bottom-10 right-10 z-[60] hide">
        <input type="file" id="hidden-file-input" class="hide" onchange="processFile(this.files[0])" multiple>
        <button onclick="document.getElementById('hidden-file-input').click()" class="bg-blue-600 w-20 h-20 rounded-3xl shadow-2xl shadow-blue-400 text-white text-3xl flex items-center justify-center hover:scale-110 active:scale-95 transition-all">
            <i class="fa-solid fa-plus"></i>
        </button>
    </div>

    <div id="settings-pane" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[200] flex items-center justify-center hide">
        <div class="bg-white w-full max-w-sm p-8 rounded-3xl shadow-2xl">
            <h3 class="text-2xl font-bold text-slate-800 mb-6">Account Security</h3>
            <div class="space-y-4">
                <div>
                    <label class="text-xs font-black text-slate-400 uppercase tracking-widest">Update Master Password</label>
                    <input type="password" id="new-sys-pass" placeholder="Enter new password" class="w-full mt-2 p-4 bg-slate-50 border-2 border-transparent focus:border-blue-500 rounded-2xl outline-none transition">
                </div>
                <div class="flex gap-3 pt-4">
                    <button onclick="updatePassword()" class="flex-1 bg-slate-800 text-white py-4 rounded-2xl font-bold">Save Change</button>
                    <button onclick="toggleSettings()" class="px-6 py-4 bg-slate-100 text-slate-500 rounded-2xl font-bold">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. SYSTEM INITIALIZATION ---
        const DEFAULT_PASS = "admin123";
        const DEFAULT_USER = "admin@nebula.com";

        if (!localStorage.getItem('nebula_pass')) localStorage.setItem('nebula_pass', DEFAULT_PASS);
        
        let files = JSON.parse(localStorage.getItem('nebula_db')) || [];

        // --- 2. AUTHENTICATION ---
        document.getElementById('login-form').onsubmit = (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;

            if (email === DEFAULT_USER && pass === localStorage.getItem('nebula_pass')) {
                sessionStorage.setItem('nebula_active', 'true');
                startSystem();
            } else {
                alert("Access Denied: Invalid Credentials");
            }
        };

        function logout() {
            sessionStorage.clear();
            location.reload();
        }

        function updatePassword() {
            const val = document.getElementById('new-sys-pass').value;
            if (val.length < 4) return alert("Password must be at least 4 characters");
            localStorage.setItem('nebula_pass', val);
            alert("Password updated! Security synchronized.");
            toggleSettings();
        }

        function toggleSettings() {
            document.getElementById('settings-pane').classList.toggle('hide');
        }

        // --- 3. UNLIMITED FILE LOGIC ---
        function processFile(file) {
            if (!file) return;

            const statusBox = document.getElementById('upload-status-box');
            const progressBar = document.getElementById('upload-progress');
            const progressName = document.getElementById('upload-name');
            const progressPercent = document.getElementById('upload-percent');

            statusBox.classList.remove('hide');
            progressName.innerText = `Encrypting: ${file.name}`;
            
            const reader = new FileReader();

            // Simulate "Infinite" Upload Speed for UI
            reader.onprogress = (data) => {
                if (data.lengthComputers) {
                    const progress = Math.round((data.loaded / data.total) * 100);
                    progressBar.style.width = progress + '%';
                    progressPercent.innerText = progress + '%';
                }
            };

            reader.onload = (e) => {
                const fileData = {
                    id: Date.now() + Math.random(),
                    name: file.name,
                    size: formatSize(file.size),
                    content: e.target.result,
                    mime: file.type,
                    date: new Date().toLocaleDateString()
                };

                files.unshift(fileData);
                syncDB();
                
                setTimeout(() => {
                    statusBox.classList.add('hide');
                    progressBar.style.width = '0%';
                }, 1000);
            };

            reader.readAsDataURL(file);
        }

        function formatSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function syncDB() {
            try {
                localStorage.setItem('nebula_db', JSON.stringify(files));
            } catch (e) {
                alert("Local Memory Full: In a real system, files would now move to the cloud server.");
            }
            renderGrid();
        }

        // --- 4. UI RENDERING ---
        function renderGrid() {
            const grid = document.getElementById('file-grid');
            const hint = document.getElementById('empty-hint');
            
            grid.innerHTML = '';
            if (files.length === 0) hint.classList.remove('hide');
            else hint.classList.add('hide');

            files.forEach(f => {
                const isImg = f.mime.startsWith('image/');
                const card = document.createElement('div');
                card.className = "file-card group bg-white border border-slate-100 rounded-3xl overflow-hidden shadow-sm hover:shadow-xl transition-all relative";
                card.innerHTML = `
                    <div class="h-40 bg-slate-50 flex items-center justify-center overflow-hidden">
                        ${isImg ? `<img src="${f.content}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-file-code text-5xl text-blue-200"></i>`}
                    </div>
                    <div class="p-5">
                        <h4 class="font-bold text-slate-700 truncate text-sm" title="${f.name}">${f.name}</h4>
                        <p class="text-[10px] font-black text-slate-300 uppercase mt-1 tracking-widest">${f.size} • ${f.date}</p>
                    </div>
                    <div class="action-overlay absolute inset-0 bg-slate-900/60 opacity-0 flex items-center justify-center gap-2 transition-all backdrop-blur-[2px]">
                        <button onclick="downloadFile(${f.id})" class="w-12 h-12 bg-white rounded-2xl text-blue-600 hover:scale-110 transition"><i class="fa-solid fa-download"></i></button>
                        <button onclick="deleteFile(${f.id})" class="w-12 h-12 bg-white rounded-2xl text-red-500 hover:scale-110 transition"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function downloadFile(id) {
            const file = files.find(f => f.id === id);
            const a = document.createElement('a');
            a.href = file.content;
            a.download = file.name;
            a.click();
        }

        function deleteFile(id) {
            if (confirm("Permanently delete this file from Nebula?")) {
                files = files.filter(f => f.id !== id);
                syncDB();
            }
        }

        // --- 5. DRAG & DROP SYSTEM ---
        const dropZone = document.getElementById('drop-zone');
        
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(name => {
            dropZone.addEventListener(name, e => {
                e.preventDefault();
                e.stopPropagation();
            });
        });

        dropZone.addEventListener('dragover', () => dropZone.classList.add('drop-zone--over'));
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drop-zone--over'));
        dropZone.addEventListener('drop', (e) => {
            dropZone.classList.remove('drop-zone--over');
            const droppedFiles = e.dataTransfer.files;
            [...droppedFiles].forEach(processFile);
        });

        // --- 6. STARTUP ---
        function startSystem() {
            if (sessionStorage.getItem('nebula_active')) {
                document.getElementById('auth-screen').classList.add('hide');
                document.getElementById('app-screen').classList.remove('hide');
                document.getElementById('fab').classList.remove('hide');
                renderGrid();
            } else {
                document.getElementById('auth-screen').classList.remove('hide');
            }
        }

        window.onload = startSystem;
    </script>
</body>
</html>
