<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nokia ActionCam: Retro Pro</title>
    <style>
        :root {
            --lcd-bg: #94b494; --case-finish: #2d3436; --btn-plastic: #636e72; --rec-red: #d63031;
        }

        body { 
            background: #111; display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; margin: 0; font-family: 'Courier New', Courier, monospace; 
            user-select: none; color: white; overflow: hidden;
        }

        .action-body { 
            width: 95vw; max-width: 600px; background: var(--case-finish); 
            border-radius: 20px; box-shadow: 0 20px 60px #000; 
            display: flex; flex-direction: row; align-items: center; 
            padding: 15px; position: relative; border: 6px solid #1e272e;
            box-sizing: border-box;
        }

        .screen-area { flex-grow: 1; display: flex; flex-direction: column; align-items: center; }
        .bezel { 
            width: 100%; max-width: 320px; height: 220px; background: #7f8c8d; 
            border-radius: 10px; display: flex; justify-content: center; align-items: center; 
            box-shadow: inset 0 0 20px #000; border: 4px solid #000; padding: 5px;
            box-sizing: border-box; position: relative;
        }
        .screen { 
            width: 100%; height: 100%; background-color: var(--lcd-bg); 
            position: relative; overflow: hidden; display: flex; flex-direction: column;
        }

        /* Viewport Layers */
        #cam-layer, #gal-layer { position: absolute; top:0; left:0; width:100%; height:100%; display:none; z-index: 50; }
        video, img { width:100%; height:100%; object-fit:cover; }

        /* Preview-only filters (Recording uses Canvas-baked filters) */
        .f0_Nokia { filter: grayscale(100%) sepia(100%) hue-rotate(60deg) contrast(140%); }
        .f1_BW    { filter: grayscale(100%) contrast(160%); }
        .f2_Sepia { filter: sepia(100%) contrast(120%); }

        .top-info { display: flex; justify-content: space-between; font-size: 10px; padding: 4px; z-index: 100; color: #000; font-weight: bold; background: rgba(148, 180, 148, 0.4); }
        .ui-center { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; color: #000; text-align: center; }
        .footer { font-size: 11px; text-align: center; border-top: 1px solid #000; z-index: 100; padding: 3px 0; color: #000; font-weight: bold; background: rgba(148, 180, 148, 0.4); }

        /* Buttons Grid */
        .controls-right { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-left: 12px; }
        .p-btn {
            width: 65px; height: 48px; background: var(--btn-plastic); border: none;
            border-radius: 8px; color: white; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px #2d3436; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 8px;
        }
        .p-btn:active { transform: translateY(2px); box-shadow: 0 2px #2d3436; }
        .p-btn.red { background: var(--rec-red); box-shadow: 0 4px #822222; }

        #filter-indicator {
            position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
            font-size: 9px; color: #fff; background: #000; padding: 2px 8px; border-radius: 10px; z-index: 200; display:none;
        }
        .rec-dot { color: var(--rec-red); animation: blink 1s infinite; display: none; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div class="action-body">
    <div class="screen-area">
        <div id="filter-indicator">NOKIA GREEN</div>
        <div class="bezel">
            <div class="screen">
                <div class="top-info">
                    <span id="rec-dot" class="rec-dot">●REC</span> 
                    <span id="clock">00:00:00</span>
                    <span id="rec-timer" style="display:none; color:red;">00s</span>
                </div>

                <div id="cam-layer"><video id="preview" autoplay playsinline muted></video></div>
                <div id="gal-layer">
                    <img id="gal-img" style="display:none;">
                    <video id="gal-vid" style="display:none;" loop muted playsinline></video>
                </div>

                <div class="ui-center" id="ui-main">NOKIA<br>ACTION</div>
                <div class="footer" id="ui-footer">MENU</div>
            </div>
        </div>
    </div>

    <div class="controls-right">
        <button class="p-btn" style="background:#d35400" onclick="cycleFilter()"><span>☼</span>FLTR</button>
        <button class="p-btn" style="background:#2980b9" onclick="flipCamera()"><span>🔄</span>FLIP</button>
        <button class="p-btn red" onclick="pressAction()"><span>OK</span>ACT</button>
        <button class="p-btn" onclick="navStep(-1)"><span>▲</span>UP</button>
        <button class="p-btn" onclick="downloadCurrent()"><span>⬇</span>SAVE</button>
        <button class="p-btn" onclick="pressBack()"><span>←</span>BACK</button>
    </div>
</div>

<canvas id="rec-canvas" width="640" height="480" style="display:none;"></canvas>

<script>
    let state = "HOME", facingMode = "environment";
    const filters = [
        {name: "Nokia Green", class: "f0_Nokia", ctx: "grayscale(1) sepia(1) hue-rotate(60deg) contrast(1.4)"},
        {name: "Classic B&W", class: "f1_BW", ctx: "grayscale(1) contrast(1.6)"},
        {name: "Vintage Sepia", class: "f2_Sepia", ctx: "sepia(1) contrast(1.2)"}
    ];
    let filterIdx = 0, photos = [], stream = null, recorder = null, chunks = [];
    let menuIdx = 0, galleryIdx = 0, recStartTime = 0;

    const uiMain = document.getElementById("ui-main"), uiFooter = document.getElementById("ui-footer");
    const camLayer = document.getElementById("cam-layer"), galLayer = document.getElementById("gal-layer");
    const videoPreview = document.getElementById("preview"), fltrInd = document.getElementById("filter-indicator");
    const recCanvas = document.getElementById("rec-canvas");
    const ctx = recCanvas.getContext("2d");

    async function startCam(isVid) {
        try {
            if(stream) stream.getTracks().forEach(t => t.stop());
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode } });
            videoPreview.srcObject = stream;
            state = isVid ? "CAMERA_VIDEO" : "CAMERA_PHOTO";
            camLayer.style.display = "block"; galLayer.style.display = "none"; uiMain.style.visibility = "hidden";
            fltrInd.style.display = "block";
            updateUI();
        } catch (e) { alert("Camera Error"); }
    }

    function pressAction() {
        if (state === "HOME") { state = "MENU"; updateUI(); }
        else if (state === "MENU") {
            if (menuIdx === 0) startCam(false);
            else if (menuIdx === 1) startCam(true);
            else if (menuIdx === 2) openGallery();
        }
        else if (state === "CAMERA_PHOTO") capturePhoto();
        else if (state === "CAMERA_VIDEO") toggleVideo();
    }

    // --- BAKED PHOTO CAPTURE ---
    function capturePhoto() {
        ctx.filter = filters[filterIdx].ctx;
        ctx.drawImage(videoPreview, 0, 0, 640, 480);
        // Overlay Timestamp on Photo
        ctx.filter = "none"; ctx.fillStyle = "black"; ctx.font = "20px Courier";
        ctx.fillText(new Date().toLocaleTimeString(), 20, 460);
        
        photos.push({type: 'img', src: recCanvas.toDataURL("image/jpeg")});
        uiFooter.innerText = "CAPTURED!";
        setTimeout(() => updateUI(), 800);
    }

    // --- BAKED VIDEO RECORDING ENGINE ---
    function toggleVideo() {
        if (recorder && recorder.state === "recording") {
            recorder.stop();
            document.getElementById("rec-dot").style.display = "none";
            document.getElementById("rec-timer").style.display = "none";
        } else {
            chunks = [];
            const canvasStream = recCanvas.captureStream(30); // Capture canvas at 30fps
            recorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm;codecs=vp8' });
            
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                photos.push({type: 'vid', src: URL.createObjectURL(blob)});
                uiFooter.innerText = "SAVED!";
            };

            recStartTime = Date.now();
            recorder.start();
            document.getElementById("rec-dot").style.display = "inline";
            document.getElementById("rec-timer").style.display = "inline";
            requestAnimationFrame(drawVideoFrame);
        }
    }

    function drawVideoFrame() {
        if (recorder && recorder.state === "recording") {
            // 1. Apply Filter
            ctx.filter = filters[filterIdx].ctx;
            ctx.drawImage(videoPreview, 0, 0, 640, 480);
            
            // 2. Apply "Handycam" Overlays directly to pixels
            ctx.filter = "none";
            ctx.fillStyle = "red"; ctx.font = "bold 24px Arial";
            ctx.fillText("● REC", 30, 50);
            
            ctx.fillStyle = "white"; ctx.font = "20px Courier";
            const elapsed = Math.floor((Date.now() - recStartTime) / 1000);
            ctx.fillText(`00:00:${elapsed.toString().padStart(2, '0')}`, 480, 50);
            ctx.fillText(new Date().toLocaleDateString(), 30, 450);

            document.getElementById("rec-timer").innerText = elapsed + "s";
            requestAnimationFrame(drawVideoFrame);
        }
    }

    function downloadCurrent() {
        if (state !== "GALLERY" || photos.length === 0) return;
        const item = photos[galleryIdx];
        const link = document.createElement('a');
        link.href = item.src;
        link.download = `NOKIA_RETRO_${Date.now()}.${item.type === 'img' ? 'jpg' : 'webm'}`;
        link.click();
    }

    async function flipCamera() {
        if (!state.startsWith("CAMERA")) return;
        facingMode = (facingMode === "user") ? "environment" : "user";
        await startCam(state === "CAMERA_VIDEO");
    }

    function openGallery() {
        if (photos.length === 0) { uiMain.style.visibility = "visible"; uiMain.innerHTML = "EMPTY"; return; }
        state = "GALLERY"; galleryIdx = photos.length - 1;
        uiMain.style.visibility = "hidden"; updateGallery();
    }

    function updateGallery() {
        camLayer.style.display = "none"; galLayer.style.display = "block";
        const item = photos[galleryIdx];
        const gImg = document.getElementById("gal-img"), gVid = document.getElementById("gal-vid");
        if(item.type === 'img') { gImg.src = item.src; gImg.style.display = "block"; gVid.style.display = "none"; }
        else { gVid.src = item.src; gVid.style.display = "block"; gImg.style.display = "none"; gVid.play(); }
        uiFooter.innerText = `ITEM ${galleryIdx + 1}/${photos.length}`;
    }

    function navStep(dir) {
        if (state === "MENU") { menuIdx = (menuIdx + dir + 3) % 3; updateUI(); }
        else if (state === "GALLERY") { galleryIdx = (galleryIdx + dir + photos.length) % photos.length; updateGallery(); }
    }

    function cycleFilter() {
        filterIdx = (filterIdx + 1) % filters.length;
        videoPreview.className = filters[filterIdx].class;
        fltrInd.innerText = filters[filterIdx].name;
    }

    function pressBack() {
        if(stream) stream.getTracks().forEach(t => t.stop());
        state = "HOME"; camLayer.style.display = "none"; galLayer.style.display = "none"; 
        fltrInd.style.display = "none"; uiMain.style.visibility = "visible"; updateUI();
    }

    function updateUI() {
        const menus = ["PHOTO MODE", "VIDEO MODE", "GALLERY"];
        if (state === "HOME") { uiMain.style.visibility = "visible"; uiMain.innerHTML = "NOKIA<br>ACTION"; uiFooter.innerText = "MENU"; }
        else if (state === "MENU") { uiMain.innerHTML = `📂<br>${menus[menuIdx]}`; uiFooter.innerText = "SELECT (OK)"; }
        else if (state.startsWith("CAMERA")) { uiFooter.innerText = state === "CAMERA_PHOTO" ? "CAPTURE (OK)" : "STOP (OK)"; }
    }

    setInterval(() => {
        const d = new Date(); document.getElementById('clock').innerText = d.toLocaleTimeString();
    }, 1000);
</script>
</body>
</html>
